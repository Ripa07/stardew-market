<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Stardew Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <div id="navbar"></div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card login-card">

        <div class="login-card-body">

            <h3 class="text-center mb-4">REGISTRO</h3>

            <form action="index.html" method="get">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Ingrese su nombre">
                </div>

                <div class="mb-3">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input type="text" id="apellido" class="form-control" placeholder="Ingrese su apellido">
                </div>

                <div class="mb-3">
                    <label for="emailRegistro" class="form-label">Email</label>
                    <input type="email" id="emailRegistro" class="form-control" placeholder="Ingrese su email">
                </div>

                <div class="mb-3">
                    <label for="passwordRegistro" class="form-label">Contraseña</label>
                    <input type="password" id="passwordRegistro" class="form-control" placeholder="Ingrese una contraseña">
                </div>

                <div class="mb-3">
                    <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Registrarse
                </button>

            </form>

        </div>

    </div>

<script src="js/script.js"></script>
</body>
</html>
