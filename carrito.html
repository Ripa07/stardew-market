<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Market - Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <div id="navbar"></div>

    <h1 class="text-center carrito-titulo">
    🛒 Carrito de Compras
    </h1>

    <div class="container mt-5">
        <div class="row">

            <div class="col-lg-8">
                <div id="productos-carrito" class="row g-4"></div>
            </div>

            <div class="col-lg-4">
                <div class="p-3 resumen-carrito">

                    <h2>Resumen</h2>

                    <div id="resumen-productos"></div>

                    <hr>

                    <h3 id="total-carrito">
                        Total: $0
                    </h3>

                    <div class="acciones-carrito">

                    <button class="btn-finalizar" onclick="finalizarCompra()">
                        Finalizar Compra
                    </button>

                    <button class="btn-vaciar"
                        onclick="vaciarCarrito()">
                        Vaciar
                    </button>

                </div>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>

</body>
</html>
